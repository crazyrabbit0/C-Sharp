name: Feature request
description: Suggest an improvement or a new program
labels: [enhancement]
assignees: [crazyrabbit0]
body:
  - type: input
    id: script
    attributes:
      label: Program
      placeholder: An existing program, or a new idea
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What should it do?
    validations:
      required: true
